services:
  - type: web
    name: ramani-foundation-api
    runtime: python
    pythonVersion: "3.11"
    
    # Build configuration
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    
    # Environment variables
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: "production"
    
    # Health check
    healthCheckPath: "/"
    
    # Auto-deploy
    autoDeploy: true
