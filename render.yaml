services:
  - type: web
    name: ramani-foundation-api
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: "production"
      - key: PORT
        value: "10000"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: "ngo_uploads"
    healthCheckPath: "/"
    healthCheckStartTimeout: 300
    autoDeploy: true
